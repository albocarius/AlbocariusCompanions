[project]
name = "albocarius-editor"
version = "0.1.0"
description = "Node editor for AlbocariusCompanions companion packs (PySide6)."
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
# QtMultimedia for the inspector's play button; without it the button is not shown.
audio = ["PySide6-Addons>=6.7"]

[project.scripts]
albocarius-editor = "albocarius_editor.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albocarius_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
